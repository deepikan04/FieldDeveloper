[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-rate-limited-router"
version = "0.1.0"
description = "A token-aware rate-limited LLM model router with fallback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "asgi-lifespan",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_router"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
